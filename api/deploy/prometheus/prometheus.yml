global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-api
    # "server" and port 9100 resolve inside the compose network only; the
    # metrics listener is deliberately separate from the public API port.
    static_configs:
      - targets: ["server:9100"]
        labels:
          service: order-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
